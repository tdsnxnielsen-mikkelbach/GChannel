# azd configuration. The .NET Aspire AppHost describes every container app, the Azure Database
# for PostgreSQL flexible server (Marten), the Azure Service Bus namespace (Wolverine) and the
# Azure Managed Redis cache, so a single service entry pointed at the AppHost is all azd needs.
# Run `azd up` to provision Azure and deploy all three container apps.
name: gchannel
services:
  app:
    language: dotnet
    project: ./src/GChannel.AppHost/GChannel.AppHost.csproj
    host: containerapp

# Apply tags to the resource group after provisioning. `az tag update --operation merge`
# adds/updates these tags without removing azd's own tags (e.g. azd-env-name). Add custom
# values with `azd env set` (e.g. `azd env set TAG_OWNER alice`) and reference them below.
hooks:
  postprovision:
    shell: pwsh
    continueOnError: false
    interactive: false
    run: |
      $ErrorActionPreference = 'Stop'
      # AZURE_RESOURCE_GROUP isn't always populated in the hook env (Aspire "limited mode"),
      # so fall back to locating the resource group azd tagged with this environment name.
      $rg = $env:AZURE_RESOURCE_GROUP
      if ([string]::IsNullOrWhiteSpace($rg)) {
        $rg = az group list --tag "azd-env-name=$($env:AZURE_ENV_NAME)" --query "[0].name" -o tsv
      }
      if ([string]::IsNullOrWhiteSpace($rg)) {
        throw "Could not resolve the resource group for environment '$($env:AZURE_ENV_NAME)'."
      }
      $rgId = az group show --name $rg --query id -o tsv
      az tag update --resource-id $rgId --operation merge --tags `
        application=gchannel `
        environment=$env:AZURE_ENV_NAME `
        managed-by=azd

  # Stop-gap: azd's generated container-app template has no `resources` block, so every deploy resets
  # apiservice to the 0.5 vCPU / 1 GiB default, which its cold start (runtime Wolverine/Marten code
  # generation) exceeds, OOM-killing it in a loop. Re-apply 1 vCPU / 2 GiB after each deploy.
  postdeploy:
    shell: pwsh
    continueOnError: false
    interactive: false
    run: |
      $ErrorActionPreference = 'Stop'
      $rg = $env:AZURE_RESOURCE_GROUP
      if ([string]::IsNullOrWhiteSpace($rg)) {
        $rg = az group list --tag "azd-env-name=$($env:AZURE_ENV_NAME)" --query "[0].name" -o tsv
      }
      if ([string]::IsNullOrWhiteSpace($rg)) {
        throw "Could not resolve the resource group for environment '$($env:AZURE_ENV_NAME)'."
      }
      $memory = az containerapp show --name apiservice --resource-group $rg `
        --query "properties.template.containers[0].resources.memory" -o tsv
      if ($LASTEXITCODE -ne 0) { throw "Could not read the apiservice container app." }
      if ($memory -ne '2Gi') {
        Write-Host "Resizing apiservice from $memory to 1 vCPU / 2 GiB"
        az containerapp update --name apiservice --resource-group $rg --cpu 1.0 --memory 2.0Gi --output none
        if ($LASTEXITCODE -ne 0) { throw "Resizing apiservice failed." }
      }
