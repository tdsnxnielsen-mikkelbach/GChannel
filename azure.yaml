# azd configuration. The .NET Aspire AppHost describes every container app, the Azure Database
# for PostgreSQL flexible server (Marten), the Azure Service Bus namespace (Wolverine) and the
# Azure Managed Redis cache, so a single service entry pointed at the AppHost is all azd needs.
# Run `azd up` to provision Azure and deploy all three container apps.
name: gchannel
services:
  app:
    language: dotnet
    project: ./src/GChannel.AppHost/GChannel.AppHost.csproj
    host: containerapp

# Apply tags to the resource group after provisioning. `az tag update --operation merge`
# adds/updates these tags without removing azd's own tags (e.g. azd-env-name). Add custom
# values with `azd env set` (e.g. `azd env set TAG_OWNER alice`) and reference them below.
hooks:
  postprovision:
    shell: pwsh
    continueOnError: false
    interactive: false
    run: |
      $ErrorActionPreference = 'Stop'
      # AZURE_RESOURCE_GROUP isn't always populated in the hook env (Aspire "limited mode"),
      # so fall back to locating the resource group azd tagged with this environment name.
      $rg = $env:AZURE_RESOURCE_GROUP
      if ([string]::IsNullOrWhiteSpace($rg)) {
        $rg = az group list --tag "azd-env-name=$($env:AZURE_ENV_NAME)" --query "[0].name" -o tsv
      }
      if ([string]::IsNullOrWhiteSpace($rg)) {
        throw "Could not resolve the resource group for environment '$($env:AZURE_ENV_NAME)'."
      }
      $rgId = az group show --name $rg --query id -o tsv
      az tag update --resource-id $rgId --operation merge --tags `
        application=gchannel `
        environment=$env:AZURE_ENV_NAME `
        managed-by=azd

  # Pre-generate the Wolverine handler / HTTP endpoint code that Production loads in TypeLoadMode.Static instead
  # of Roslyn-compiling it at runtime (docs/deployment.md). Internal/Generated is git-ignored and compiled only into
  # the Release builds azd publishes. `codegen write` never deletes files of removed handlers/endpoints, so start
  # from an empty folder; the Production environment makes the generated code match the deployed DI setup.
  predeploy:
    shell: pwsh
    continueOnError: false
    interactive: false
    run: |
      $ErrorActionPreference = 'Stop'
      $env:DOTNET_ENVIRONMENT = 'Production'
      $env:ASPNETCORE_ENVIRONMENT = 'Production'
      foreach ($project in 'GChannel.ApiService', 'GChannel.Worker') {
        $dir = Join-Path $PWD "src/$project"
        $generated = Join-Path $dir 'Internal/Generated'
        if (Test-Path $generated) { Remove-Item $generated -Recurse -Force }
        Push-Location $dir
        try {
          $output = dotnet run --no-launch-profile -- codegen write 2>&1
          if ($LASTEXITCODE -ne 0) { $output | Write-Host; throw "Wolverine codegen failed for $project." }
        }
        finally { Pop-Location }
        $count = @(Get-ChildItem $generated -Recurse -Filter *.cs -ErrorAction SilentlyContinue).Count
        if ($count -eq 0) { throw "Wolverine codegen wrote no files for $project." }
        Write-Host "Pre-generated $count Wolverine code files for $project"
      }
