# azd configuration. The .NET Aspire AppHost describes every container app,
# the Azure SQL (serverless) database and the Azure Managed Redis cache, so a
# single service entry pointed at the AppHost is all azd needs.
# Run `azd up` to provision Azure and deploy both container apps.
name: gchannel
services:
  app:
    language: dotnet
    project: ./src/GChannel.AppHost/GChannel.AppHost.csproj
    host: containerapp

# Apply tags to the resource group after provisioning. `az tag update --operation merge`
# adds/updates these tags without removing azd's own tags (e.g. azd-env-name). Add custom
# values with `azd env set` (e.g. `azd env set TAG_OWNER alice`) and reference them below.
hooks:
  postprovision:
    shell: pwsh
    continueOnError: false
    interactive: false
    run: |
      $rgId = az group show --name $env:AZURE_RESOURCE_GROUP --query id -o tsv
      az tag update --resource-id $rgId --operation merge --tags `
        application=gchannel `
        environment=$env:AZURE_ENV_NAME `
        managed-by=azd
